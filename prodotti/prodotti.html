<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione Prodotti - Italo Ordini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary text-white shadow-sm">
      <div class="container-fluid">
        <a href="../index.html">
          <button class="btn btn-warning me-auto">Torna alla Home</button>
        </a>
        <span class="mx-auto navbar-text fw-bold fs-4 text-center">Gestione Prodotti</span>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-3 gap-2">
        <button class="btn btn-accent" id="btnAggiungiProdotto">Aggiungi Prodotto</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped table-modern align-middle" id="tabellaProdotti">
          <thead>
            <tr>
              <th scope="col">NUMERO</th>
              <th scope="col">Nome Prodotto</th>
              <th scope="col">Modifica</th>
              <th scope="col">Elimina</th>
            </tr>
          </thead>
          <tbody>
            <!-- Righe generate dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal Aggiungi/Modifica Prodotto -->
    <div class="modal fade" id="modalProdotto" tabindex="-1" aria-labelledby="modalProdottoLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="modalProdottoLabel">Aggiungi Prodotto</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
          </div>
          <div class="modal-body">
            <form id="formProdotto">
              <div class="mb-3">
                <label for="inputNomeProdotto" class="form-label">Nome Prodotto</label>
                <input type="text" class="form-control" id="inputNomeProdotto" required>
              </div>
            </form>
          </div>
          <div class="modal-footer flex-column flex-sm-row">
            <button type="button" class="btn btn-secondary mb-2 mb-sm-0" data-bs-dismiss="modal">Chiudi</button>
            <button type="button" class="btn btn-primary" id="btnSalvaProdotto">Salva</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS e script custom -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="prodotti.js"></script>
  </body>
</html>
